[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-router"
version = "0.1.0"
description = "Central LLM provider/model assignment resolver: providers, models, and purpose->chain resolution."
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Marc" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.21",
    "alembic>=1.13",
    "typer>=0.9",
    "rich>=13.7",
    "inquirerpy>=0.3.4",
    "pydantic>=2.7",
    "httpx>=0.27",
    "pydantic-ai-slim[openai]>=0.1",
    "openai>=1.40",
    "mcp<2",
]

[project.scripts]
llm-router = "llm_router.cli:app"
llm-router-mcp = "llm_router.mcp.server:mcp"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_router", "src/llm_router_client"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.mypy]
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
